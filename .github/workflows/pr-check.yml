name: Pull Request Quality & Security Pipeline

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  backend-qa:
    name: Backend Tests, Lint & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Run Backend Regression Test Suite
        working-directory: api
        run: |
          python -m pytest -v

  frontend-qa:
    name: Frontend Build, Typecheck & Accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Node Dependencies
        working-directory: web
        run: npm ci

      - name: Type Check & Production Build
        working-directory: web
        run: npm run build
